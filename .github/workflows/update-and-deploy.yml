name: Update fixtures and deploy to GitHub Pages

# 試合日程はgoal.com/jpをスクレイピングして取得する(API-Football無料プランの
# 3日分ローリングウィンドウ制限を回避するため)。API-Footballはクラブ/選手の
# 名寄せ(scripts/resolve_jp_clubs.py, 手動実行)にのみ使用し、この定期実行では
# クオータを消費しない。
#
# イングランドの所属ディビジョン(プレミアリーグ/チャンピオンシップ)は
# API-Football無料プランがシーズン2022〜2024しか参照できず現行シーズンに
# 追従できないため、Yahoo!スポーツの順位表(scripts/scrape_england_divisions.py)
# から毎回取得し、昇降格を自動反映する(2026-09-09追加)。

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch England division standings
        run: python scripts/scrape_england_divisions.py

      - name: Fetch upcoming fixtures
        run: python scripts/scrape_goal_fixtures.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json data/fixtures_history.json data/england_divisions.json
          git diff --cached --quiet || git commit -m "chore: update fixtures data"
          git push || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Notify IndexNow (Bing/Yandex)
        run: python scripts/notify_indexnow.py
