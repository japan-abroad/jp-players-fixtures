name: Update fixtures and deploy to GitHub Pages

# discoverフェーズ(所属クラブの発見)は無料APIプランの1日100リクエスト上限を
# 使い切ってしまうため、この定期実行には含めない。頻度が低くても問題ない
# discoverは discover-clubs.yml で手動トリガーのみとし、
# こちらは軽量なfixtures取得(1日あたり約40リクエスト)だけを回す。

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "fixtures取得をスキップし、既存のdata/fixtures.jsonのままビルド・公開する(見た目確認用)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch upcoming fixtures
        if: github.event.inputs.skip_fetch != 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/fetch_fixtures.py

      - name: Commit updated data
        if: github.event.inputs.skip_fetch != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          git diff --cached --quiet || git commit -m "chore: update fixtures data"
          git push || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
