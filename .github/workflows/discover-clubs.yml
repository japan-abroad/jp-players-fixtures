name: Discover clubs with Japanese players

# 全チームのロースターをスキャンするため数分かかる。
# 移籍市場が動いた後などに手動で実行する想定。

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Discover clubs with Japanese players
        run: python scripts/discover_jp_clubs.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "chore: update jp_clubs discovery data"
          git push || true
